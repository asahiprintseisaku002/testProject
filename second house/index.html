<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Three.js GLB 操作ツール</title>
 <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.1/examples/jsm/"
        }
      }
    </script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <div id="canvas-container"></div>

    <div id="ui">
      <h2 class="row full">各パーツ操作</h2>

      <div class="row collapsible">
        <input type="checkbox" class="row-toggle" id="t-group" />
        <label class="row-label" for="t-group">パーツ選択</label>
        <div class="row-body">
          <select id="group-select">
            <option value="">（パーツを選んで操作）</option>
          </select>
        </div>
      </div>

      <!-- 表示 / 非表示 -->
      <div class="row collapsible">
        <input type="checkbox" class="row-toggle" id="t-visible" />
        <label class="row-label" for="t-visible">表示 / 非表示</label>
        <div class="row-body">
          <div id="group-vis-list" class="stack"><!-- JSで動的に追加 --></div>
        </div>
      </div>

      <!--<div class="row">
        <label>変形モード</label>
        <div class="stack">
          <button id="mode-translate" class="tiny">移動</button>
          <button id="mode-rotate" class="tiny">回転</button>
          <button id="mode-scale" class="tiny">スケール</button>
        </div>
      </div>-->

      <!--<div class="row">
        <label>スナップ</label>
        <div class="stack">
          <button id="snap-move" class="tiny">移動 0.1m</button>
          <button id="snap-rot" class="tiny">回転 90°</button>
          <button id="snap-off" class="tiny">スナップ無効</button>
        </div>
      </div>-->

      <!-- 90°回転 -->
        <div class="row collapsible">
          <input type="checkbox" class="row-toggle" id="t-rot" />
          <label class="row-label" for="t-rot">90°回転</label>
          <div class="row-body">
            <div class="stack">
              <button id="rot-left" class="tiny">-90°</button>
              <button id="rot-right" class="tiny">+90°</button>
            </div>
          </div>
        </div>

        <!-- 色変更 -->
        <div class="row collapsible">
          <input type="checkbox" class="row-toggle" id="t-color" />
          <label class="row-label" for="t-color">色変更</label>
          <div class="row-body">
            <input id="color-input" type="color" value="#ffffff" />
          </div>
        </div>

        <!-- テクスチャ -->
        <div class="row collapsible">
          <input type="checkbox" class="row-toggle" id="t-tex" />
          <label class="row-label tex-input-title" for="t-tex">テクスチャ</label>
          <div class="row-body">
            <input id="tex-input" type="file" accept=".png,.jpg,.jpeg,.webp" disabled />
          </div>
        </div>

        <!-- 半透明 -->
        <div class="row collapsible">
          <input type="checkbox" class="row-toggle" id="t-semi" />
          <label class="row-label" for="t-semi">半透明</label>
          <div class="row-body">
            <div class="stack">
              <button id="semi-on" class="tiny">ON</button>
              <button id="semi-off" class="tiny">OFF</button>
            </div>
          </div>
        </div>

      <!--
      <div class="row">
        <label>簡易アニメ</label>
        <button id="pulse" class="full">ポンッと膨らむ</button>
      </div>
      -->

      <!-- リセット -->
        <div class="row collapsible">
          <input type="checkbox" class="row-toggle" id="t-reset" />
          <label class="row-label" for="t-reset">リセット</label>
          <div class="row-body">
            <div class="stack reset">
              <button id="reset-selected-only" class="tiny">選択のみリセット</button>
              <button id="reset-material" class="tiny">色/透明/テクスチャ</button>
              <button id="clear-tex" class="tiny danger" disabled>テクスチャ除去</button>
              <button id="show-all-groups" class="tiny">全て表示</button>
              <button id="reset-all" class="tiny danger">全てリセット</button>
            </div>
          </div>
        </div>

        <!-- 撮影 -->
        <div class="row collapsible">
          <input type="checkbox" class="row-toggle" id="t-capture" />
          <label class="row-label" for="t-capture">撮影</label>
          <div class="row-body">
            <div class="stack capture">
              <button id="capture-png" class="full">画面を撮影（PNG保存）</button>
            </div>
          </div>
        </div>


      <div id="footer-note" class="row full">
        ・グループを選んで軸ギズモ（TransformControls）で操作します。<br />
        ・軸ギズモ（TransformControls）をドラッグすると移動できます。<br />
        ・表示/非表示はチェックボックスで個別に切り替えられます。
      </div>
    </div>
  </div>

  <!-- Three.js ロジック -->
  <script type="module" src="./main.js"></script>
</body>
</html>
